<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>잘생김 판독기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
    
    <!-- MediaPipe AI 모델 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #F2F2F7;
            color: #1C1C1E;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        .spring-up {
            animation: springUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.15) forwards;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes springUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .btn-active:active {
            transform: scale(0.96);
        }
        
        .progress-bar {
            transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen w-full flex justify-center items-center overflow-hidden selection:bg-gray-200">

    <main class="w-full max-w-md h-full flex flex-col relative bg-white sm:rounded-[40px] sm:h-[90vh] sm:border-[8px] border-gray-100 shadow-2xl overflow-hidden">
        
        <div id="view-home" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-[#F2F2F7] z-20 transition-opacity duration-300">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-black tracking-tight text-gray-900 mb-3">
                    잘생김 판독기
                </h1>
                <p class="text-gray-500 font-medium text-sm leading-relaxed">
                    AI가 당신의 얼굴 비율을 분석해<br>
                    매력을 측정해 드립니다!
                </p>
            </div>
            
            <button id="btn-start" class="w-full bg-gray-900 text-white font-bold text-lg rounded-[22px] py-4 shadow-lg transition-all btn-active flex justify-center items-center">
                <span>판정 시작하기</span>
            </button>
            <p id="loading-msg" class="text-xs text-gray-400 mt-4 hidden">AI 모델 준비 중...</p>
        </div>

        <div id="view-scan" class="absolute inset-0 bg-black z-10 hidden flex-col">
            <header class="absolute top-0 w-full p-6 z-20 flex justify-center items-center bg-gradient-to-b from-black/70 to-transparent text-white">
                <div id="scan-timer" class="font-mono text-xl font-bold bg-black/50 px-4 py-1.5 rounded-xl backdrop-blur-md">WAIT</div>
            </header>
            
            <div class="relative w-full h-full flex-1 overflow-hidden">
                <video id="camera-stream" playsinline class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1]"></video>
                <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1] z-10 pointer-events-none"></canvas>
                
                <!-- 스캔 UI (인식 시 등장) -->
                <div id="scan-ui" class="absolute inset-0 z-10 hidden">
                    <div class="absolute inset-0 bg-black/40 mix-blend-multiply"></div>
                </div>
            </div>
            
            <div class="absolute bottom-10 w-full text-center z-20 px-6">
                <p id="scan-status" class="text-white/90 text-sm font-medium bg-black/60 backdrop-blur-md py-3 px-6 rounded-full inline-block">
                    얼굴을 가이드 영역에 맞춰주세요
                </p>
            </div>
        </div>

        <div id="view-result" class="absolute inset-0 bg-[#F2F2F7] z-30 hidden flex-col overflow-y-auto">
            <!-- 캡처된 이미지 영역 -->
            <div class="relative w-full h-64 bg-gray-900">
                <img id="captured-image" class="w-full h-full object-cover opacity-60" />
                <div class="absolute inset-0 bg-gradient-to-t from-[#F2F2F7] to-transparent"></div>
                
                <div class="absolute bottom-4 left-6">
                    <p class="text-xs font-bold text-gray-500 tracking-widest mb-1">ANALYSIS REPORT</p>
                    <h2 id="res-animal" class="text-3xl font-extrabold text-gray-900">판정 중...</h2>
                </div>
                
                <div class="absolute bottom-4 right-6 text-right">
                    <p class="text-xs font-bold text-gray-500 mb-1">TOTAL SCORE</p>
                    <div class="text-4xl font-black text-red-500" id="res-score">0</div>
                </div>
            </div>

            <!-- 상세 분석 데이터 -->
            <div class="px-6 py-6 space-y-6 flex-1">
                <!-- 총평 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h3 class="text-sm font-bold text-gray-400 mb-2">종합 평가</h3>
                    <p id="res-summary" class="text-gray-800 text-sm font-medium leading-relaxed">평가 내용이 이곳에 표시됩니다.</p>
                </div>

                <!-- 수치 바 -->
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1.5">
                            <span>얼굴 상중하 길이 (세로 비율)</span>
                            <span id="stat-vertical-text">계산 중</span>
                        </div>
                        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="stat-vertical-bar" class="h-full bg-gray-800 rounded-full w-0 transition-all duration-1000"></div>
                        </div>
                        <p id="stat-vertical-desc" class="text-[11px] text-gray-400 mt-1">이마, 코, 하관의 길이가 1:1:0.8일 때 가장 이상적입니다.</p>
                    </div>

                    <div>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1.5">
                            <span>눈과 미간 너비 (가로 비율)</span>
                            <span id="stat-horizontal-text">계산 중</span>
                        </div>
                        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="stat-horizontal-bar" class="h-full bg-gray-800 rounded-full w-0 transition-all duration-1000 delay-100"></div>
                        </div>
                        <p id="stat-horizontal-desc" class="text-[11px] text-gray-400 mt-1">눈의 가로 길이와 미간의 너비가 1:1일 때 가장 이상적입니다.</p>
                    </div>
                </div>
            </div>

            <!-- 하단 액션 버튼 -->
            <div class="p-6 bg-white border-t border-gray-100 grid grid-cols-2 gap-3 pb-safe">
                <button id="btn-share" class="w-full bg-blue-500 text-white font-bold text-sm rounded-[18px] py-3.5 btn-active flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    결과 공유하기
                </button>
                <button id="btn-retry" class="w-full bg-gray-100 text-gray-700 font-bold text-sm rounded-[18px] py-3.5 btn-active">
                    다시 검사하기
                </button>
            </div>
        </div>

    </main>

    <!-- 공유용 숨김 캔버스 -->
    <canvas id="share-canvas" width="800" height="1200" class="hidden"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // UI 요소
            const viewHome = document.getElementById('view-home');
            const viewScan = document.getElementById('view-scan');
            const viewResult = document.getElementById('view-result');
            
            const btnStart = document.getElementById('btn-start');
            const loadingMsg = document.getElementById('loading-msg');
            const btnRetry = document.getElementById('btn-retry');
            const btnShare = document.getElementById('btn-share');
            
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('output-canvas');
            const ctx = canvas.getContext('2d');
            
            const scanUi = document.getElementById('scan-ui');
            const scanStatus = document.getElementById('scan-status');
            const scanTimer = document.getElementById('scan-timer');
            const capturedImage = document.getElementById('captured-image');
            
            // 결과 UI 요소
            const resScore = document.getElementById('res-score');
            const resAnimal = document.getElementById('res-animal');
            const resSummary = document.getElementById('res-summary');
            const statVerticalText = document.getElementById('stat-vertical-text');
            const statVerticalBar = document.getElementById('stat-vertical-bar');
            const statVerticalDesc = document.getElementById('stat-vertical-desc');
            const statHorizontalText = document.getElementById('stat-horizontal-text');
            const statHorizontalBar = document.getElementById('stat-horizontal-bar');
            const statHorizontalDesc = document.getElementById('stat-horizontal-desc');

            // 상태 변수
            let cameraStream = null;
            let faceMesh = null;
            let isModelLoaded = false;
            let detectionState = 'IDLE'; // IDLE, DETECTED, SCANNING, DONE
            let scanStartTimestamp = 0;
            const SCAN_DURATION = 3000;
            let latestLandmarks = null;
            let capturedDataUrl = "";
            let finalAnalysisResult = null;
            let cameraFrameRequest = null;
            let lastVideoTime = -1;

            // MediaPipe FaceMesh 초기화
            function initFaceMesh() {
                faceMesh = new FaceMesh({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                }});

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });

                faceMesh.onResults(onFaceMeshResults);
                
                // 가짜 이미지로 초기화 워밍업
                const dummyCanvas = document.createElement('canvas');
                dummyCanvas.width = 1; dummyCanvas.height = 1;
                faceMesh.send({image: dummyCanvas}).then(() => {
                    isModelLoaded = true;
                    btnStart.disabled = false;
                    loadingMsg.classList.add('hidden');
                });
            }

            // 거리 계산 유틸리티
            function distance(p1, p2) {
                return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
            }
            
            // 각도 계산 유틸리티 (도 단위)
            function calculateAngle(p1, p2) {
                const dy = p2.y - p1.y;
                const dx = p2.x - p1.x;
                return Math.atan2(dy, dx) * (180 / Math.PI);
            }

            // 분석 핵심 로직 (냉혹한 기준)
            function analyzeFace(landmarks) {
                // 주요 랜드마크 인덱스
                const HAIRLINE = 10;
                const GLABELLA = 168; // 미간
                const NOSE_TIP = 1;
                const SUBNASALE = 2; // 코밑
                const MENTON = 152; // 턱끝
                const EYE_L_IN = 133, EYE_L_OUT = 33;
                const EYE_R_IN = 362, EYE_R_OUT = 263;
                const FACE_L = 234, FACE_R = 454;
                const MOUTH_L = 61, MOUTH_R = 291;

                // 1. 수직 비례 (상:중:하)
                const upper = distance(landmarks[HAIRLINE], landmarks[GLABELLA]);
                const middle = distance(landmarks[GLABELLA], landmarks[SUBNASALE]);
                const lower = distance(landmarks[SUBNASALE], landmarks[MENTON]);
                const totalH = upper + middle + lower;
                
                const normUpper = upper / middle;
                const normLower = lower / middle;
                // 이상적 기준 1 : 1 : 0.8
                const upperErr = Math.abs(1 - normUpper);
                const lowerErr = Math.abs(0.8 - normLower);
                const verticalScore = Math.max(0, 100 - (upperErr * 100 + lowerErr * 100));

                // 2. 수평 비례 (안검열)
                const leftEyeW = distance(landmarks[EYE_L_OUT], landmarks[EYE_L_IN]);
                const rightEyeW = distance(landmarks[EYE_R_OUT], landmarks[EYE_R_IN]);
                const intercanthal = distance(landmarks[EYE_L_IN], landmarks[EYE_R_IN]);
                const avgEyeW = (leftEyeW + rightEyeW) / 2;
                
                // 눈길이 vs 미간 (이상 1:1)
                const horizErr = Math.abs(avgEyeW - intercanthal) / avgEyeW;
                const horizontalScore = Math.max(0, 100 - (horizErr * 150));

                // 3. 눈꼬리 기울기 (Canthal Tilt)
                const leftTilt = -calculateAngle(landmarks[EYE_L_OUT], landmarks[EYE_L_IN]);
                const rightTilt = calculateAngle(landmarks[EYE_R_OUT], landmarks[EYE_R_IN]);
                const avgTilt = (leftTilt + rightTilt) / 2;

                // 4. 얼굴 너비 비율 (가로/세로)
                const faceWidth = distance(landmarks[FACE_L], landmarks[FACE_R]);
                const faceHeight = distance(landmarks[HAIRLINE], landmarks[MENTON]);
                const faceRatio = faceWidth / faceHeight; // 둥글수록 큼

                // 최종 점수 산정 (가차없이)
                const finalScore = Math.floor((verticalScore * 0.4) + (horizontalScore * 0.4) + (Math.random() * 10 + 10)); // 최대치 보정해도 100점 어려움

                // 일반인이 이해하기 쉬운 친절한 해설
                let vDesc = "";
                if (normLower > 0.95) vDesc = "턱선이 시원하게 뻗어 있어서 성숙하고 세련된 매력이 돋보여요. ";
                else if (normLower < 0.7) vDesc = "하관이 짧은 편이라 안면 비율상 완벽한 '동안' 얼굴형이네요! ";
                else vDesc = "이마, 코, 턱으로 이어지는 세로 길이가 거의 황금비에 가까워 안정감을 줍니다. ";
                
                let hDesc = "";
                if (intercanthal > avgEyeW * 1.1) hDesc = "눈 사이 간격이 살짝 넓어서 인상이 아주 부드럽고 여유로워 보여요.";
                else if (intercanthal < avgEyeW * 0.9) hDesc = "눈 사이가 가까운 편이라 이목구비가 얼굴에 꽉 차 보이고 뚜렷한 인상이네요.";
                else hDesc = "눈의 가로 길이와 미간의 너비가 1:1에 딱 맞아떨어지는 이상적인 비율입니다!";

                let summary = "";
                if (finalScore >= 85) summary = "비율 깡패! 전체적인 이목구비 밸런스가 훌륭합니다. " + vDesc + hDesc;
                else if (finalScore >= 70) summary = "매력적인 비율을 가졌어요. " + vDesc + hDesc;
                else if (finalScore >= 55) summary = "개성 있고 매력적인 얼굴입니다. " + vDesc + hDesc;
                else summary = "유니크한 분위기가 시선을 끄는 얼굴이네요. " + vDesc + hDesc;

                // 동물상 판정
                let animal = "강아지상 (Dog)";
                if (normLower > 1.0) animal = "말상 (Horse)";
                else if (avgTilt > 6) animal = "고양이상 (Cat)";
                else if (avgTilt > 3 && normLower > 0.85) animal = "늑대상 (Wolf)";
                else if (avgTilt > 4 && faceRatio < 0.65) animal = "여우상 (Fox)";
                else if (faceRatio > 0.75) animal = "곰상 (Bear)";
                else if (avgEyeW / faceWidth > 0.22) animal = "사슴상 (Deer)";
                else if (avgEyeW / faceWidth > 0.2 && normLower <= 0.75) animal = "토끼상 (Rabbit)";
                else if (distance(landmarks[MOUTH_L], landmarks[MOUTH_R]) / faceWidth > 0.4) animal = "공룡상 (Dinosaur)";
                else if (normUpper > 1.2 && normLower < 0.8) animal = "원숭이상 (Monkey)";

                return {
                    score: finalScore,
                    summary: summary,
                    animal: animal,
                    vRatio: `1 : 1 : ${normLower.toFixed(2)}`,
                    vScore: verticalScore,
                    hRatio: `눈 1 : 미간 ${(intercanthal/avgEyeW).toFixed(2)}`,
                    hScore: horizontalScore
                };
            }

            async function startCamera() {
                try {
                    // 왜곡 방지를 위해 브라우저 기본 최적화 비율 사용
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user" }
                    });
                    video.srcObject = cameraStream;
                    
                    video.onloadedmetadata = () => {
                        video.play();
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        detectionState = 'DETECTED'; // 카메라 켜지면 탐지 시작
                        scanStatus.textContent = '얼굴 탐색 중...';
                        scanTimer.textContent = 'WAIT';
                        scanUi.classList.add('hidden');
                        predictWebcam();
                    };
                } catch (err) {
                    alert("카메라 접근 권한이 필요합니다.");
                    viewHome.classList.remove('hidden');
                    viewScan.classList.add('hidden');
                }
            }

            function stopCamera() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                if (cameraFrameRequest) {
                    cancelAnimationFrame(cameraFrameRequest);
                }
            }

            async function predictWebcam() {
                if (video.currentTime !== lastVideoTime && (detectionState === 'DETECTED' || detectionState === 'SCANNING')) {
                    lastVideoTime = video.currentTime;
                    await faceMesh.send({image: video});
                }
                if (detectionState !== 'DONE') {
                    cameraFrameRequest = requestAnimationFrame(predictWebcam);
                }
            }

            // 분석 프레임 캡처
            function captureFrame() {
                const vw = video.videoWidth || canvas.width;
                const vh = video.videoHeight || canvas.height;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = vw;
                tempCanvas.height = vh;
                const tCtx = tempCanvas.getContext('2d');
                
                // 거울모드 캡처
                tCtx.translate(vw, 0);
                tCtx.scale(-1, 1);
                tCtx.drawImage(video, 0, 0, vw, vh);
                
                capturedDataUrl = tempCanvas.toDataURL("image/jpeg", 0.9);
                capturedImage.src = capturedDataUrl;
            }

            // FaceMesh 결과 처리 및 UI 업데이트
            function onFaceMeshResults(results) {
                if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                    scanStatus.textContent = '얼굴을 찾지 못했어요.';
                    scanStatus.classList.replace('text-white/90', 'text-red-400');
                    scanUi.classList.add('hidden');
                    detectionState = 'DETECTED'; // 리셋
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                const width = canvas.width;
                const height = canvas.height;
                const landmarks = results.multiFaceLandmarks[0];
                
                // 픽셀 좌표계로 변환
                const pxLandmarks = landmarks.map(lm => ({
                    x: lm.x * width,
                    y: lm.y * height,
                    z: lm.z * width
                }));
                latestLandmarks = pxLandmarks;

                // 스캔 상태 관리
                if (detectionState === 'DETECTED') {
                    scanStatus.textContent = '얼굴을 인식했습니다. 정밀 스캔 중...';
                    scanStatus.classList.replace('text-red-400', 'text-white/90');
                    scanUi.classList.remove('hidden');
                    scanStartTimestamp = Date.now();
                    detectionState = 'SCANNING';
                }

                if (detectionState === 'SCANNING') {
                    const elapsed = Date.now() - scanStartTimestamp;
                    const remain = Math.max(0, 3 - Math.floor(elapsed / 1000));
                    scanTimer.textContent = `00:0${remain}`;

                    // 실시간 메시 그리기 (사이버틱한 화이트 가이드)
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowBlur = 5;

                    const drawPath = (indices, closed = false) => {
                        ctx.beginPath();
                        indices.forEach((idx, i) => {
                            const pt = pxLandmarks[idx];
                            if(i===0) ctx.moveTo(pt.x, pt.y);
                            else ctx.lineTo(pt.x, pt.y);
                        });
                        if(closed) ctx.closePath();
                        ctx.stroke();
                    };

                    // 얼굴 윤곽, 양 눈, 코 그리기
                    drawPath([10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109, 10]);
                    drawPath([33, 160, 158, 133, 153, 144, 33], true);
                    drawPath([362, 385, 387, 263, 373, 380, 362], true);
                    drawPath([168, 6, 197, 195, 5, 4, 1]);

                    // 주요 특징점 강조 (흰색 점)
                    ctx.fillStyle = '#FFFFFF';
                    ctx.shadowBlur = 8;
                    [10, 152, 234, 454, 33, 263, 1, 61, 291].forEach(idx => {
                        const pt = pxLandmarks[idx];
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    });

                    // 스캐닝 수평선 이펙트
                    const progress = Math.min(1, elapsed / SCAN_DURATION);
                    const scanY = canvas.height * progress;
                    ctx.beginPath();
                    ctx.moveTo(0, scanY);
                    ctx.lineTo(canvas.width, scanY);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (elapsed >= SCAN_DURATION) {
                        detectionState = 'DONE';
                        scanTimer.textContent = 'DONE';
                        finishScan();
                    }
                }
            }

            // 스캔 완료 및 결과 표시
            function finishScan() {
                captureFrame(); // 카메라 끄기 전에 먼저 화면을 캡처!
                stopCamera();
                
                finalAnalysisResult = analyzeFace(latestLandmarks);
                
                // 결과 UI에 데이터 세팅
                resScore.textContent = finalAnalysisResult.score;
                resAnimal.textContent = finalAnalysisResult.animal;
                resSummary.textContent = finalAnalysisResult.summary;
                
                statVerticalText.textContent = finalAnalysisResult.vRatio;
                statHorizontalText.textContent = finalAnalysisResult.hRatio;

                viewScan.classList.add('hidden');
                viewResult.classList.remove('hidden');
                viewResult.classList.add('flex', 'fade-in');

                // 스캔 결과가 도출된 후, 공유 캔버스를 미리 백그라운드에서 그려놓음
                prepareShareImage();

                // 바 애니메이션 실행 (지연)
                setTimeout(() => {
                    statVerticalBar.style.width = `${Math.min(finalAnalysisResult.vScore, 100)}%`;
                    statVerticalBar.className = `h-full rounded-full transition-all duration-1000 ${finalAnalysisResult.vScore >= 80 ? 'bg-green-500' : (finalAnalysisResult.vScore >= 60 ? 'bg-blue-500' : 'bg-red-500')}`;
                    
                    statHorizontalBar.style.width = `${Math.min(finalAnalysisResult.hScore, 100)}%`;
                    statHorizontalBar.className = `h-full rounded-full transition-all duration-1000 delay-100 ${finalAnalysisResult.hScore >= 80 ? 'bg-green-500' : (finalAnalysisResult.hScore >= 60 ? 'bg-blue-500' : 'bg-red-500')}`;
                }, 100);
            }

            // 공유 이미지 미리 생성 로직
            function prepareShareImage() {
                const sCanvas = document.getElementById('share-canvas');
                const sCtx = sCanvas.getContext('2d');
                
                sCanvas.width = 800;
                sCanvas.height = 1200;
                
                const img = new Image();
                img.onload = () => {
                    // 1. 전체 배경
                    sCtx.fillStyle = '#111827';
                    sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);

                    const scale = Math.max(sCanvas.width / img.width, sCanvas.height / img.height);
                    const drawW = img.width * scale;
                    const drawH = img.height * scale;
                    const x = (sCanvas.width - drawW) / 2;
                    const y = (sCanvas.height - drawH) / 2;

                    sCtx.save();
                    sCtx.globalAlpha = 0.3;
                    sCtx.drawImage(img, x, y, drawW, drawH);
                    sCtx.restore();

                    // 2. 글래스모피즘 스타일 중앙 화이트 카드
                    sCtx.fillStyle = 'rgba(255, 255, 255, 0.96)';
                    sCtx.shadowColor = 'rgba(0,0,0,0.15)';
                    sCtx.shadowBlur = 40;
                    sCtx.shadowOffsetY = 20;
                    roundRect(sCtx, 50, 100, 700, 1000, 40);
                    sCtx.fill();
                    sCtx.shadowColor = 'transparent';

                    // 3. 카드 상단 프로필 원형 이미지
                    const pScale = Math.max(240 / img.width, 240 / img.height);
                    const pW = img.width * pScale;
                    const pH = img.height * pScale;
                    
                    sCtx.save();
                    sCtx.beginPath();
                    sCtx.arc(400, 280, 120, 0, Math.PI * 2);
                    sCtx.clip();
                    sCtx.drawImage(img, 400 - pW/2, 280 - pH/2, pW, pH);
                    sCtx.restore();

                    // 원형 이미지 테두리
                    sCtx.strokeStyle = '#FFFFFF';
                    sCtx.lineWidth = 6;
                    sCtx.beginPath();
                    sCtx.arc(400, 280, 120, 0, Math.PI * 2);
                    sCtx.stroke();

                    // 4. 타이틀 및 텍스트 데이터
                    sCtx.textAlign = 'center';
                    sCtx.fillStyle = '#6B7280';
                    sCtx.font = 'bold 22px sans-serif';
                    sCtx.fillText('AI가 분석한 나의 동물상', 400, 460);
                    
                    sCtx.fillStyle = '#111827';
                    sCtx.font = '900 64px sans-serif';
                    sCtx.fillText(finalAnalysisResult.animal, 400, 540);

                    sCtx.fillStyle = '#EF4444';
                    sCtx.font = '900 48px sans-serif';
                    sCtx.fillText(finalAnalysisResult.score + '점', 400, 610);

                    // 5. 구분선
                    sCtx.strokeStyle = '#E5E7EB';
                    sCtx.lineWidth = 2;
                    sCtx.beginPath();
                    sCtx.moveTo(120, 670);
                    sCtx.lineTo(680, 670);
                    sCtx.stroke();

                    // 6. 총평 텍스트 (자동 줄바꿈 중심 정렬)
                    sCtx.fillStyle = '#374151';
                    sCtx.font = '500 24px sans-serif';
                    const words = finalAnalysisResult.summary.split(' ');
                    let line = '';
                    let yPos = 740;
                    for(let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + ' ';
                        const metrics = sCtx.measureText(testLine);
                        if(metrics.width > 560 && n > 0) {
                            sCtx.fillText(line.trim(), 400, yPos);
                            line = words[n] + ' ';
                            yPos += 36;
                        } else {
                            line = testLine;
                        }
                    }
                    sCtx.fillText(line.trim(), 400, yPos);

                    // 7. 수치 바 UI
                    yPos += 80;
                    
                    sCtx.textAlign = 'left';
                    sCtx.fillStyle = '#6B7280';
                    sCtx.font = 'bold 20px sans-serif';
                    sCtx.fillText('얼굴 상중하 길이 (세로 비율)', 120, yPos);
                    sCtx.textAlign = 'right';
                    sCtx.fillText(finalAnalysisResult.vRatio, 680, yPos);
                    
                    yPos += 20;
                    sCtx.fillStyle = '#F3F4F6';
                    roundRect(sCtx, 120, yPos, 560, 16, 8);
                    sCtx.fill();
                    sCtx.fillStyle = (finalAnalysisResult.vScore >= 80) ? '#34C759' : (finalAnalysisResult.vScore >= 60 ? '#007AFF' : '#FF3B30');
                    roundRect(sCtx, 120, yPos, 560 * (Math.min(finalAnalysisResult.vScore, 100)/100), 16, 8);
                    sCtx.fill();

                    yPos += 70;
                    
                    sCtx.textAlign = 'left';
                    sCtx.fillStyle = '#6B7280';
                    sCtx.fillText('눈과 미간 너비 (가로 비율)', 120, yPos);
                    sCtx.textAlign = 'right';
                    sCtx.fillText(finalAnalysisResult.hRatio, 680, yPos);
                    
                    yPos += 20;
                    sCtx.fillStyle = '#F3F4F6';
                    roundRect(sCtx, 120, yPos, 560, 16, 8);
                    sCtx.fill();
                    sCtx.fillStyle = (finalAnalysisResult.hScore >= 80) ? '#34C759' : (finalAnalysisResult.hScore >= 60 ? '#007AFF' : '#FF3B30');
                    roundRect(sCtx, 120, yPos, 560 * (Math.min(finalAnalysisResult.hScore, 100)/100), 16, 8);
                    sCtx.fill();
                };
                img.src = capturedDataUrl;
            }

            // 둥근 사각형 헬퍼
            function roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            // 이벤트 리스너
            btnStart.addEventListener('click', () => {
                viewHome.classList.add('hidden');
                viewScan.classList.remove('hidden');
                viewScan.classList.add('flex');
                startCamera();
            });

            btnRetry.addEventListener('click', () => {
                viewResult.classList.add('hidden');
                viewResult.classList.remove('fade-in');
                viewHome.classList.remove('hidden');
                
                statVerticalBar.style.width = '0%';
                statHorizontalBar.style.width = '0%';
            });

            // 공유 버튼 로직 (동기적 Blob 변환으로 권한 우회)
            btnShare.addEventListener('click', async () => {
                const sCanvas = document.getElementById('share-canvas');
                const dataUrl = sCanvas.toDataURL("image/jpeg", 0.9);
                
                // Base64를 Blob으로 동기 변환
                const arr = dataUrl.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--){
                    u8arr[n] = bstr.charCodeAt(n);
                }
                const blob = new Blob([u8arr], {type:mime});
                const file = new File([blob], "face-analysis.jpg", { type: "image/jpeg" });
                
                try {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: '잘생김 판독기 결과',
                            files: [file]
                        });
                    } else {
                        // 미지원 기기를 위한 다운로드 폴백
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        a.download = 'face-analysis.jpg';
                        a.click();
                    }
                } catch (err) {
                    console.error("공유 취소 또는 에러:", err);
                }
            });

            // 앱 초기화
            btnStart.disabled = true;
            loadingMsg.classList.remove('hidden');
            initFaceMesh();
        });
    </script>
